<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>菜谱库 · 小白学菜</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --paper: #fffdf8;
      --ink: #191914;
      --muted: #6e6c63;
      --faint: #a09e94;
      --line: rgba(25, 25, 20, .13);
      --line-soft: rgba(25, 25, 20, .07);
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button, input { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }

    .skip {
      position: absolute;
      left: -999px;
      top: 12px;
      z-index: 50;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
    }

    .skip:focus { left: 12px; }

    .wrap {
      width: min(1160px, calc(100vw - 40px));
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 68px;
      padding: 0 clamp(20px, 4vw, 46px);
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .topbar-right { justify-content: flex-end; }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .04em;
      text-decoration: none;
      white-space: nowrap;
    }

    .wordmark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
    }

    .menu-wrap { position: relative; }

    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 4px;
      font-size: 14px;
      color: var(--muted);
    }

    .menu-btn:hover { color: var(--ink); }

    .menu-pop {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 30;
      width: 260px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 16px 40px rgba(25, 25, 20, .09);
    }

    .nav-link {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 10px;
      font-size: 15px;
      text-decoration: none;
    }

    .nav-link:hover { background: var(--line-soft); }
    .nav-link small { color: var(--faint); font-size: 12px; }
    .nav-link.current { background: var(--ink); color: var(--bg); }
    .nav-link.current small { color: rgba(255, 255, 255, .7); }

    .topbar-center {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .text-link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .text-link:hover { color: var(--ink); }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 14px;
      text-decoration: none;
    }

    .hero {
      padding: clamp(64px, 10vw, 112px) 0 48px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--faint);
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      margin-right: 10px;
      vertical-align: middle;
      background: currentColor;
    }

    h1, h2, h3 { font-family: var(--serif); }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      font-weight: 550;
      letter-spacing: -.04em;
    }

    .hero-note {
      max-width: 720px;
      margin: 20px 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 820px;
      padding: 8px 8px 8px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      box-shadow: 0 18px 44px rgba(25, 25, 20, .06);
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 16px;
    }

    .search input::placeholder { color: var(--faint); }

    .search .ghost {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }

    .search .ghost:hover { background: var(--line-soft); color: var(--ink); }

    .recent {
      margin-top: 16px;
      color: var(--faint);
      font-size: 13px;
    }

    .recent button {
      margin-left: 6px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .recent button:hover { border-color: var(--ink); color: var(--ink); }

    .unlock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
    }

    .unlock strong {
      display: block;
      margin-bottom: 5px;
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 550;
    }

    .unlock span {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.7;
    }

    .unlock.is-open {
      border-color: rgba(25, 25, 20, .28);
      background: #eef0e7;
    }

    .unlock-progress {
      flex: none;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 26px;
    }

    .filters {
      display: grid;
      gap: 14px;
      padding: 24px 0 10px;
      border-top: 1px solid var(--line);
    }

    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .filter-label {
      flex: none;
      padding-top: 7px;
      color: var(--faint);
      font-size: 12px;
      letter-spacing: .12em;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }

    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip.selected { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    .results-wrap { padding: 36px 0 100px; }

    .results-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .results-head strong { font-family: var(--serif); font-size: 22px; font-weight: 550; }
    .results-head span { color: var(--faint); font-size: 13px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(25, 25, 20, .07);
    }

    .cover {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--line-soft);
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover .level {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(25, 25, 20, .45);
      color: rgba(255, 255, 255, .96);
      font-size: 11px;
      backdrop-filter: blur(4px);
    }

    .card-body { padding: 17px 18px 19px; }

    .card-meta {
      display: flex;
      gap: 10px;
      color: var(--faint);
      font-size: 12px;
    }

    .card h3 {
      margin: 12px 0 8px;
      font-size: 22px;
      font-weight: 550;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.75;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .card-tags span {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--line-soft);
      color: var(--muted);
      font-size: 11.5px;
    }

    .card-tags .source-tag {
      background: var(--ink);
      color: var(--bg);
    }

    .match {
      margin-top: 13px !important;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
      color: var(--faint) !important;
      font-size: 12.5px !important;
    }

    .match b { color: var(--muted); }

    .empty {
      padding: 70px 20px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 550;
    }

    footer {
      padding: 34px 20px 44px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 13px;
      text-align: center;
    }

    footer p { margin: 5px 0; }

    @media (max-width: 920px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .topbar { grid-template-columns: 1fr auto; }
      .topbar-center { display: none; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 28px, 1160px); }
      .cards { grid-template-columns: 1fr; }
      .topbar-right .text-link { display: none; }
      .search { border-radius: 18px; padding: 8px 8px 8px 16px; }
      .search .pill { padding: 10px 15px; }
      .filter-row { display: block; }
      .filter-label { display: block; margin-bottom: 8px; }
      .unlock { align-items: flex-start; }
      .unlock-progress { font-size: 22px; }
      .results-head { display: block; }
      .results-head span { display: block; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-left">
      <a class="wordmark" href="index.html" aria-label="小白学菜 首页">
        <span class="wordmark-dot" aria-hidden="true"></span>小白学菜
      </a>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-haspopup="true">
          板块
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <nav class="menu-pop hidden" id="menuPop" aria-label="网站板块">
          <a class="nav-link" href="courses.html"><span>课程列表</span><small>按课学习</small></a>
          <a class="nav-link current" href="library.html"><span>菜谱库</span><small>搜索</small></a>
          <a class="nav-link" href="my-recipes.html"><span>我的菜谱</span><small>自己添加</small></a>
          <a class="nav-link" href="kitchen.html"><span>我的厨房</span></a>
        </nav>
      </div>
    </div>

    <p class="topbar-center">从零开始，学会做菜</p>

    <div class="topbar-right">
      <a class="text-link" href="index.html">首页</a>
      <a class="pill" href="kitchen.html">我的厨房</a>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap">
      <p class="eyebrow">个人菜谱库</p>
      <h1>今天想做什么？</h1>
      <p class="hero-note">用菜名、食材、做法或口味来搜；除了九道基础课，这里也会搜到你自己添加的菜谱。比如输入“鸡蛋”“焯水”“收汁”“快手”。</p>

      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" autocomplete="off" aria-label="搜索菜谱" placeholder="搜菜名、食材或步骤，例如：番茄 / 焯水 / 收汁">
        <button class="pill" type="submit">搜索</button>
        <button class="ghost" id="clearBtn" type="button">清空</button>
      </form>

      <p class="recent hidden" id="recentWrap">最近搜索：<span id="recentChips"></span></p>
      <p class="recent"><a class="text-link" href="my-recipes.html">还没有自己的菜谱？添加一道 →</a></p>
    </section>

    <section class="wrap">
      <div class="unlock" id="unlockPanel" aria-live="polite"></div>
    </section>

    <section class="wrap filters" aria-label="搜索筛选">
      <div class="filter-row">
        <span class="filter-label">课程</span>
        <div class="chips" data-filter="level">
          <button class="chip selected" type="button" data-value="all">全部</button>
          <button class="chip" type="button" data-value="1">阶段一</button>
          <button class="chip" type="button" data-value="2">阶段二</button>
          <button class="chip" type="button" data-value="3">阶段三</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">学习状态</span>
        <div class="chips" data-filter="progress">
          <button class="chip selected" type="button" data-value="all">全部</button>
          <button class="chip" type="button" data-value="todo">还没练</button>
          <button class="chip" type="button" data-value="done">已练过</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">来源</span>
        <div class="chips" data-filter="source">
          <button class="chip selected" type="button" data-value="all">全部</button>
          <button class="chip" type="button" data-value="builtin">内置课程</button>
          <button class="chip" type="button" data-value="custom">我的菜谱</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">口味与类型</span>
        <div class="chips" data-filter="tag" id="tagFilters"></div>
      </div>
    </section>

    <section class="results-wrap wrap">
      <div class="results-head">
        <strong id="resultCount">菜谱</strong>
        <span id="activeQuery"></span>
      </div>
      <div class="cards" id="results"></div>
      <div class="empty hidden" id="emptyState">
        <strong>没有找到合适的菜谱</strong>
        换一个食材或做法试试，比如“鸡蛋”“凉拌”“一锅出”。
      </div>
    </section>
  </main>

  <footer>
    <p>小白学菜 · 个人菜谱库</p>
    <p><a class="text-link" href="index.html">回到首页</a></p>
  </footer>

  <script src="data/recipes.js"></script>
  <script src="assets/my-recipes-store.js"></script>
  <script src="library.js"></script>
</body>
</html>
