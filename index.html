<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小白学菜 · 从零开始学做菜</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --paper: #fffdf8;
      --ink: #191914;
      --muted: #6e6c63;
      --faint: #a09e94;
      --line: rgba(25, 25, 20, .13);
      --line-soft: rgba(25, 25, 20, .07);
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .skip {
      position: absolute;
      left: -999px;
      top: 12px;
      z-index: 50;
      padding: 10px 16px;
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      text-decoration: none;
    }

    .skip:focus {
      left: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 68px;
      padding: 0 clamp(20px, 4vw, 46px);
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 28px;
      min-width: 0;
    }

    .topbar-left {
      justify-content: flex-start;
    }

    .topbar-right {
      justify-content: flex-end;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .04em;
      text-decoration: none;
      white-space: nowrap;
    }

    .wordmark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
      flex: none;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
      padding: 7px 4px;
    }

    .menu-btn:hover {
      color: var(--ink);
    }

    .menu-btn svg {
      transition: transform .2s ease;
    }

    .menu-btn[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .menu-pop {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 260px;
      padding: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(25, 25, 20, .09);
      z-index: 30;
    }

    .menu-pop.hidden {
      display: none;
    }

    .nav-link {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
    }

    .nav-link:hover {
      background: var(--line-soft);
    }

    .nav-link small {
      font-size: 12px;
      color: var(--faint);
    }

    .topbar-center {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .help {
      width: 19px;
      height: 19px;
      border: 1px solid var(--faint);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 12px;
      line-height: 1;
      color: var(--muted);
      display: inline-grid;
      place-items: center;
      padding: 0 0 1px;
    }

    .help:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .help-tip {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100vw - 40px));
      background: var(--ink);
      color: var(--bg);
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.7;
      box-shadow: 0 16px 40px rgba(25, 25, 20, .18);
      z-index: 40;
    }

    .help-tip::after {
      content: "";
      position: absolute;
      top: -5px;
      left: calc(50% - 5px);
      width: 10px;
      height: 10px;
      background: var(--ink);
      transform: rotate(45deg);
    }

    .text-link {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    .text-link:hover {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 14px;
      font-weight: 550;
      text-decoration: none;
      border: 1px solid var(--ink);
      transition: transform .16s ease, opacity .16s ease;
      white-space: nowrap;
    }

    .pill:hover {
      transform: translateY(-1px);
    }

    .pill:disabled {
      opacity: .55;
      cursor: default;
      transform: none;
    }

    .hero {
      padding: clamp(56px, 9vh, 104px) 24px 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      font-size: 13px;
      letter-spacing: .32em;
      color: var(--muted);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      vertical-align: middle;
      background: var(--faint);
      margin: 0 14px;
    }

    .hero h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(74px, 16.5vw, 208px);
      line-height: 1.06;
      letter-spacing: .02em;
    }

    .prompt {
      max-width: 680px;
      margin: clamp(40px, 6vh, 68px) auto 0;
      text-align: center;
    }

    .prompt-rail {
      width: 1px;
      height: 38px;
      margin: 0 auto 16px;
      background: var(--line);
    }

    .prompt-head {
      margin: 0;
      font-size: 16px;
      font-weight: 550;
    }

    .prompt-sub {
      margin: 6px 0 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .prompt-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 20px 14px;
      text-align: left;
      box-shadow: 0 1px 0 rgba(25, 25, 20, .02);
    }

    .prompt-card textarea {
      display: block;
      width: 100%;
      min-height: 88px;
      padding: 8px 4px 4px;
      border: 0;
      background: transparent;
      resize: none;
      font: 400 17px/1.8 var(--sans);
      color: var(--ink);
      outline: none;
    }

    .prompt-card textarea::placeholder {
      color: var(--faint);
    }

    .prompt-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }

    .prompt-meta .pill {
      padding: 10px 24px;
      font-size: 15px;
    }

    .prompt-hints {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12.5px;
      color: var(--faint);
    }

    .example-btn {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .example-btn:hover {
      color: var(--ink);
    }

    .feed {
      max-width: 1160px;
      margin: 0 auto;
      padding: clamp(80px, 12vh, 126px) 24px 90px;
    }

    .feed-head {
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }

    .feed-head .eyebrow {
      margin-bottom: 18px;
    }

    .feed-head h2 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.3;
    }

    .feed-head p:last-child {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
    }

    .feed-actions {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .cards {
      margin-top: 58px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      text-align: left;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(25, 25, 20, .07);
    }

    .card-link {
      display: block;
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
    }

    .card-link:hover .card {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(25, 25, 20, .07);
    }

    .cover {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: linear-gradient(140deg, var(--a), var(--b));
    }

    .cover-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
    }

    .cover-index {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: var(--serif);
      font-size: 12px;
      line-height: 1;
      letter-spacing: .08em;
      color: rgba(255, 255, 255, .95);
      background: rgba(25, 25, 20, .38);
      padding: 6px 11px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      user-select: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(25, 25, 20, .08), transparent 30%);
    }

    .card-body {
      padding: 15px 17px 17px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--faint);
    }

    .card-title {
      margin: 12px 0 7px;
      font-family: var(--serif);
      font-weight: 550;
      font-size: 21px;
      letter-spacing: .03em;
    }

    .card-learn {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--muted);
    }

    .plan-panel {
      max-width: 760px;
      margin: clamp(72px, 11vh, 118px) auto 0;
      padding: 0 24px;
      scroll-margin-top: 28px;
    }

    .plan-kicker {
      margin: 0 0 14px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .3em;
      color: var(--faint);
    }

    .plan-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: clamp(26px, 5vw, 42px);
    }

    .plan-badge {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .12em;
      color: var(--muted);
    }

    .plan-card h2 {
      margin: 18px 0 10px;
      font-family: var(--serif);
      font-weight: 550;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.35;
    }

    .plan-desc {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
    }

    .steps {
      list-style: none;
      margin: 34px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .step {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 18px 18px;
      background: var(--bg);
    }

    .step-num {
      display: block;
      font-family: var(--serif);
      font-size: 15px;
      color: var(--faint);
      margin-bottom: 14px;
    }

    .step h3 {
      margin: 0 0 7px;
      font-size: 17px;
      font-weight: 600;
    }

    .step-link {
      text-decoration: none;
      color: inherit;
    }

    .step-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .step p {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 32px 24px;
      text-align: center;
      font-size: 12.5px;
      color: var(--faint);
      line-height: 2;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 8px);
      background: var(--ink);
      color: var(--bg);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      box-shadow: 0 12px 34px rgba(25, 25, 20, .22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 60;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1000px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr auto;
      }

      .topbar-center {
        display: none;
      }

      .topbar-right .text-link {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .card-body {
        padding: 12px 14px 14px;
      }

      .card-title {
        font-size: 18px;
      }

      .steps {
        grid-template-columns: 1fr;
      }

      .prompt-meta {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .prompt-meta .pill {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .wordmark {
        font-size: 14px;
      }

      .topbar-right .pill {
        padding: 8px 14px;
        font-size: 13px;
      }

      .hero {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero h1 {
        font-size: 17.5vw;
      }

      .eyebrow {
        letter-spacing: .2em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 12px;
        margin: 0 8px;
      }
    }
  </style>
</head>

      {
        no: "08",
        name: "麻婆豆腐",
        href: "recipes/mapo-doufu.html",
        img: "assets/dishes/mapo-doufu.jpg",
        colorA: "#eccfc8",
        colorB: "#d4927f",
        lesson: "第 8 课 · 酱汁",
        time: "25 分钟",
        cost: "约 ¥10",
        learn: "学调一个咸麻微辣的酱汁，下饭神器。"
      },
      {
        no: "09",
        name: "凉拌黄瓜",
        href: "recipes/liangban-huanggua.html",
        img: "assets/dishes/liangban-huanggua.jpg",
        colorA: "#e3ecd8",
        colorB: "#b3cd9f",
        lesson: "第 9 课 · 拍黄瓜",
        time: "10 分钟",
        cost: "约 ¥5",
        learn: "学拍黄瓜和万能凉拌汁，天热时最解腻的一道凉菜。"
      }
    ];

    const cardGrid = document.getElementById("cardGrid");

    function renderCards() {
      cardGrid.innerHTML = DISHES.map(dish => {
        const card = `
          <article class="card">
          <div class="cover" style="--a:${dish.colorA};--b:${dish.colorB}">
            <img class="cover-photo" src="${dish.img}" alt="${dish.name}成品实拍图" loading="lazy">
            <span class="cover-index" aria-hidden="true">${dish.no}</span>
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span>${dish.lesson}</span>
              <span>${dish.time}</span>
            </div>
            <h3 class="card-title">${dish.name}</h3>
            <p class="card-learn">${dish.learn}</p>
          </div>
        </article>`;
        return dish.href
          ? `<a class="card-link" href="${dish.href}" aria-label="打开${dish.name}菜谱">${card}</a>`
          : card;
      }).join("");
    }

    const menuBtn = document.getElementById("menuBtn");
    const menuPop = document.getElementById("menuPop");
    const helpBtn = document.getElementById("helpBtn");
    const helpTip = document.getElementById("helpTip");
    const toast = document.getElementById("toast");

    menuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = menuPop.classList.toggle("hidden") === false;
      menuBtn.setAttribute("aria-expanded", String(open));
    });

    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", (event) => {
        const name = link.dataset.nav;
        menuPop.classList.add("hidden");
        menuBtn.setAttribute("aria-expanded", "false");
        if (name) {
          event.preventDefault();
          showToast(`「${name}」板块会在下一步搭建，先看看首页效果`);
        }
      });
    });

    helpBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      helpTip.classList.toggle("hidden");
    });

    document.addEventListener("click", (event) => {
      if (!menuPop.classList.contains("hidden") &&
          !menuWrapContains(event.target)) {
        menuPop.classList.add("hidden");
        menuBtn.setAttribute("aria-expanded", "false");
      }
      if (!helpTip.classList.contains("hidden") && event.target !== helpBtn) {
        helpTip.classList.add("hidden");
      }
    });

    function menuWrapContains(target) {
      const wrap = document.querySelector(".menu-wrap");
      return wrap && wrap.contains(target);
    }

    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    renderCards();
  </script>

  <script src="assets/ai-config.js"></script>
  <script src="assets/ai-assistant.js" defer></script>
</body>
</html>
