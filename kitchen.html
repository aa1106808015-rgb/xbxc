<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的厨房 · 小白学菜</title>
  <link rel="stylesheet" href="recipes/recipe.css">
  <style>
    .kitchen-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(50px, 8vh, 92px) 24px 0;
    }

    .kitchen-page h1 {
      margin: 0 0 14px;
      text-align: center;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(58px, 9vw, 112px);
      line-height: 1.1;
      letter-spacing: .02em;
    }

    .kitchen-sub {
      margin: 0 auto clamp(40px, 6vh, 58px);
      max-width: 520px;
      text-align: center;
      font-size: 14.5px;
      line-height: 1.9;
      color: var(--muted);
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(22px, 3.4vw, 32px);
      margin-bottom: 18px;
    }

    .card-label {
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: .26em;
      color: var(--faint);
    }

    .today-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .today-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 550;
      font-size: clamp(26px, 4vw, 38px);
    }

    .today-reason {
      margin: 12px 0 20px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
    }

    .today-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .today-actions .pill {
      padding: 11px 24px;
      font-size: 14.5px;
    }

    .checkin-btn {
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13.5px;
      color: var(--muted);
      background: var(--bg);
    }

    .checkin-btn.checked {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .progress-sum {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 18px;
    }

    .progress-sum strong {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 500;
    }

    .progress-sum span {
      font-size: 13px;
      color: var(--muted);
    }

    .level-row {
      margin-top: 14px;
    }

    .level-row-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .level-row-head span:last-child {
      color: var(--faint);
    }

    .bar {
      height: 7px;
      border-radius: 999px;
      background: var(--line-soft);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ink);
      border-radius: 999px;
      transition: width .3s ease;
    }

    .taste-lines {
      margin: 12px 0 20px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 2;
    }

    .taste-lines b {
      color: var(--ink);
      font-weight: 600;
    }

    .shop-empty {
      margin: 8px 0 0;
      font-size: 13.5px;
      color: var(--faint);
      line-height: 1.8;
    }

    .shop-list {
      list-style: none;
      margin: 6px 0 0;
      padding: 0;
    }

    .shop-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
      font-size: 14px;
    }

    .shop-list li:last-child {
      border-bottom: 0;
    }

    .shop-check {
      flex: none;
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: transparent;
      background: var(--bg);
    }

    .shop-list li.checked .shop-check {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .shop-list li.checked span {
      text-decoration: line-through;
      color: var(--faint);
    }

    .shop-note {
      margin: 14px 0 0;
      font-size: 12.5px;
      color: var(--faint);
      line-height: 1.7;
    }

    .ghost-btn {
      font-size: 13px;
      color: var(--faint);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .ghost-btn:hover {
      color: var(--ink);
    }

    @media (max-width: 900px) {
      .dash-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .kitchen-page h1 {
        font-size: 16vw;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-left">
      <a class="wordmark" href="index.html" aria-label="小白学菜 首页">
        <span class="wordmark-dot" aria-hidden="true"></span>小白学菜
      </a>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-haspopup="true">
          板块
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <nav class="menu-pop hidden" id="menuPop" aria-label="网站板块">
          <a class="nav-link" href="courses.html"><span>闯关计划</span><small>去闯关</small></a>
          <a class="nav-link" href="index.html#feed"><span>菜谱库</span></a>
          <a class="nav-link" href="taste.html"><span>我的口味</span></a>
          <a class="nav-link current" href="kitchen.html"><span>我的厨房</span><small>当前</small></a>
        </nav>
      </div>
    </div>

    <p class="topbar-center">从零开始，学会做菜</p>

    <div class="topbar-right">
      <a class="text-link" href="index.html">登录</a>
      <a class="pill" href="#today">今日练习</a>
    </div>
  </header>

  <main id="main">
    <section class="kitchen-page">
      <h1>我的厨房</h1>
      <p class="kitchen-sub">你的练习台：打开就知道今天该练哪道、还差几道通关、出门该买什么。</p>

      <div class="dash-grid">
        <div>
          <section class="card" id="today">
            <p class="card-label">TODAY</p>
            <div class="today-head">
              <h2 id="todayName">番茄炒蛋</h2>
              <span id="todayLesson" style="font-size:12px;color:var(--faint);letter-spacing:.14em;">第 1 课 · 基础</span>
            </div>
            <p class="today-reason" id="todayReason"></p>
            <div class="today-actions">
              <a class="pill" href="" id="todayLink">打开菜谱</a>
              <button class="checkin-btn" id="checkinBtn" type="button">练完打卡</button>
            </div>
          </section>

          <section class="card">
            <p class="card-label">PROGRESS</p>
            <div class="progress-sum">
              <strong id="doneCount">0/9</strong>
              <span>九道练习菜已点亮</span>
            </div>
            <div id="levelRows"></div>
            <a class="text-link" href="courses.html" style="display:inline-block;margin-top:18px;">查看完整闯关路线 →</a>
          </section>
        </div>

        <div>
          <section class="card">
            <p class="card-label">TASTE</p>
            <h2 style="margin:0 0 10px;font-family:var(--serif);font-weight:550;font-size:24px;">口味摘要</h2>
            <div class="taste-lines" id="tasteSummary">还没有填写口味档案。</div>
            <a class="pill" href="taste.html" style="padding:9px 18px;font-size:13.5px;">去填写我的口味</a>
          </section>

          <section class="card">
            <p class="card-label">SHOPPING LIST</p>
            <h2 style="margin:0 0 6px;font-family:var(--serif);font-weight:550;font-size:22px;" id="shopTitle">两菜一汤采购清单</h2>
            <p class="shop-empty hidden" id="shopEmpty"></p>
            <ul class="shop-list" id="shopList"></ul>
            <p class="shop-note" id="shopNote"></p>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>小白学菜 · 我的厨房</p>
    <p><a class="text-link" href="index.html">回到首页</a></p>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const DISH_MAP = {
      fanqie: {
        name: "番茄炒蛋",
        lesson: "第 1 课 · 基础",
        url: "recipes/fanqie-chao-dan.html",
        why: "下一道还没点亮的就是它：先练会判断油温，后面的路更好走。",
        ingredients: ["番茄 2 个", "鸡蛋 3 个", "小葱 1 根", "盐", "白糖", "食用油"]
      },
      qingcai: {
        name: "蒜蓉炒青菜",
        lesson: "第 3 课 · 火候",
        url: "recipes/suancheng-chao-qingcai.html",
        why: "青菜还没点亮：学会大火快炒，每顿饭都会需要它。",
        ingredients: ["上海青/小油菜 400 克", "大蒜 4 瓣", "盐", "食用油"]
      },
      tang: {
        name: "冬瓜丸子汤",
        lesson: "第 5 课 · 汤",
        url: "recipes/donggua-wanzi-tang.html",
        why: "汤品还没点亮：学会汆丸子，就能凑齐两菜一汤。",
        ingredients: ["冬瓜 400 克", "猪肉末 200 克", "姜 1 小块", "小葱 2 根", "淀粉", "盐", "白胡椒粉"]
      },
      menfan: {
        name: "电饭煲腊肠焖饭",
        lesson: "第 4 课 · 一锅出",
        url: "recipes/dianfanbao-lachang-menfan.html",
        why: "一人食的起点：焖饭按下按键就不用管，正好练别的。",
        ingredients: ["大米 1 杯", "广式腊肠 1 根", "干香菇 3 朵", "胡萝卜 半根", "生抽", "小葱"]
      },
      jixiong: {
        name: "香煎鸡胸肉",
        lesson: "第 6 课 · 控火",
        url: "recipes/xiangjian-jixiong.html",
        why: "高蛋白那一格还没点亮：学会中火慢煎，鸡胸不柴。",
        ingredients: ["鸡胸肉 1 块", "盐", "黑胡椒", "生抽（可选）", "食用油"]
      },
      liangban: {
        name: "黄瓜拌木耳",
        lesson: "第 8 课 · 凉拌",
        url: "recipes/huanggua-ban-muer.html",
        why: "万能凉拌汁还没练：十分钟凑出一道清爽小菜。",
        ingredients: ["干木耳 10 克", "黄瓜 1 根", "大蒜 2 瓣", "生抽", "香醋", "白糖", "香油"]
      },
      jichi: {
        name: "可乐鸡翅",
        lesson: "硬菜入门",
        url: "recipes/kele-jichi.html",
        why: "请客硬菜还没点亮：练好收汁，这道菜就稳了。",
        ingredients: ["鸡翅中 8 个", "可乐 1 罐", "姜 3–4 片", "料酒", "生抽", "白芝麻（可选）"]
      },
      mapo: {
        name: "麻婆豆腐",
        lesson: "酱汁与勾芡",
        url: "recipes/mapo-doufu.html",
        why: "下饭豆腐还没点亮：学会炒豆瓣酱和勾芡，很多菜都能通。",
        ingredients: ["嫩豆腐 1 盒", "猪肉末 80 克", "郫县豆瓣酱", "蒜 2 瓣", "姜 1 小块", "淀粉", "花椒粉", "小葱"]
      },
      huanggua: {
        name: "凉拌黄瓜",
        lesson: "解腻凉菜",
        url: "recipes/liangban-huanggua.html",
        why: "请客的凉菜还没点亮：先拍后腌，整顿饭就平衡了。",
        ingredients: ["黄瓜 2 根", "大蒜 3 瓣", "盐", "生抽", "香醋", "白糖", "香油"]
      }
    };

    const LEVELS = [
      { name: "第一关 · 两菜一汤", key: "xiaobai-level1-done-v1", ids: ["fanqie", "qingcai", "tang"] },
      { name: "第二关 · 一人食", key: "xiaobai-level2-done-v1", ids: ["menfan", "jixiong", "liangban"] },
      { name: "第三关 · 周末请客", key: "xiaobai-level3-done-v1", ids: ["jichi", "mapo", "huanggua"] }
    ];

    const GOAL_FALLBACK = {
      daily: "fanqie",
      jibei: "jixiong",
      guest: "jichi",
      family: "tang"
    };

    const GOAL_LABEL = {
      daily: "每天吃上家常菜",
      jibei: "做减脂便当",
      guest: "周末请客露一手",
      family: "给家人做一餐饭"
    };

    const menuBtn = document.getElementById("menuBtn");
    const menuPop = document.getElementById("menuPop");
    const toast = document.getElementById("toast");

    function storageGet(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (e) { /* ignore */ }
    }

    function loadDoneSet(key) {
      const set = new Set();
      const raw = storageGet(key);
      if (raw) {
        try {
          JSON.parse(raw).forEach(id => set.add(id));
        } catch (e) { /* ignore */ }
      }
      return set;
    }

    const taste = (() => {
      try {
        return JSON.parse(storageGet("xiaobai-taste-v1") || "null");
      } catch (e) {
        return null;
      }
    })();

    const allDone = new Set();
    LEVELS.forEach(level => {
      level.done = loadDoneSet(level.key);
      level.done.forEach(id => allDone.add(id));
    });

    function nextDishId() {
      for (const level of LEVELS) {
        for (const id of level.ids) {
          if (!allDone.has(id)) return id;
        }
      }
      const goalFallback = taste && GOAL_FALLBACK[taste.goal];
      return goalFallback || "fanqie";
    }

    const recId = nextDishId();
    const rec = DISH_MAP[recId];

    function renderToday() {
      document.getElementById("todayName").textContent = rec.name;
      document.getElementById("todayLesson").textContent = rec.lesson;
      document.getElementById("todayReason").textContent = allDone.size === 9
        ? "三关全部点亮了！这道是你的目标菜，用来复习或招待朋友都很合适。"
        : rec.why;
      document.getElementById("todayLink").href = rec.url;

      const today = new Date().toISOString().slice(0, 10);
      const checkKey = "xiaobai-checkin-" + today;
      const doneToday = storageGet(checkKey) === recId;
      const btn = document.getElementById("checkinBtn");
      btn.classList.toggle("checked", doneToday);
      btn.textContent = doneToday ? "今天已打卡 ✓" : "练完打卡";
      btn.addEventListener("click", () => {
        if (storageGet(checkKey) === recId) {
          storageSet(checkKey, "");
          btn.classList.remove("checked");
          btn.textContent = "练完打卡";
          showToast("已取消今日打卡");
        } else {
          storageSet(checkKey, recId);
          btn.classList.add("checked");
          btn.textContent = "今天已打卡 ✓";
          showToast(`今日练习：${rec.name}，打卡成功`);
        }
      });
    }

    function renderProgress() {
      document.getElementById("doneCount").textContent = `${allDone.size}/9`;
      const rows = document.getElementById("levelRows");
      rows.innerHTML = LEVELS.map(level => {
        const n = level.done.size;
        const pct = Math.round(n / level.ids.length * 100);
        return `
          <div class="level-row">
            <div class="level-row-head">
              <span>${level.name}</span>
              <span>${n}/${level.ids.length}</span>
            </div>
            <div class="bar"><i style="width:${pct}%"></i></div>
          </div>`;
      }).join("");
    }

    function renderTaste() {
      const el = document.getElementById("tasteSummary");
      if (!taste) {
        el.innerHTML = "还没有填写口味档案。<br>填完忌口、工具和目标后，这里会显示摘要。";
        return;
      }
      const goalText = GOAL_LABEL[taste.goal] || "";
      const lines = [
        taste.text && `<span><b>忌口：</b>${taste.text}</span>`,
        taste.tools && taste.tools.length && `<span><b>厨房：</b>${taste.tools.join("、")}</span>`,
        taste.time && `<span><b>时间：</b>${taste.time === "fast" ? "15 分钟以内" : taste.time === "half" ? "约 30 分钟" : taste.time === "weekend" ? "周末集中练" : "为了好吃不在乎时间"}</span>`,
        goalText && `<span><b>目标：</b>${goalText}</span>`
      ].filter(Boolean);
      el.innerHTML = lines.join("") || "已保存，但没有填写详细内容。";
    }

    function renderShop() {
      const list = document.getElementById("shopList");
      const empty = document.getElementById("shopEmpty");
      const note = document.getElementById("shopNote");
      if (!rec.ingredients) {
        empty.textContent = "这道菜没有固定采购项，打开菜谱按用量准备即可。";
        empty.classList.remove("hidden");
        list.innerHTML = "";
        note.textContent = "";
        return;
      }
      empty.classList.add("hidden");
      const shopKey = "xiaobai-shop-" + recId;
      let checked = [];
      try {
        checked = JSON.parse(storageGet(shopKey) || "[]");
      } catch (e) { /* ignore */ }
      document.getElementById("shopTitle").textContent = `做「${rec.name}」要买`;
      list.innerHTML = rec.ingredients.map((item, index) => {
        const isChecked = checked.includes(item);
        return `
          <li class="${isChecked ? "checked" : ""}" data-item="${item}" tabindex="0">
            <span class="shop-check">✓</span>
            <span>${item}</span>
          </li>`;
      }).join("");
      note.textContent = "买到的点一下打勾，清单会自动记住；重新做这道菜时还在。";

      list.querySelectorAll("li").forEach(li => {
        const toggle = () => {
          const item = li.dataset.item;
          const idx = checked.indexOf(item);
          if (idx >= 0) {
            checked.splice(idx, 1);
            li.classList.remove("checked");
          } else {
            checked.push(item);
            li.classList.add("checked");
          }
          storageSet(shopKey, JSON.stringify(checked));
        };
        li.addEventListener("click", toggle);
        li.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggle();
          }
        });
      });
    }

    menuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = menuPop.classList.toggle("hidden") === false;
      menuBtn.setAttribute("aria-expanded", String(open));
    });

    document.addEventListener("click", (event) => {
      const wrap = document.querySelector(".menu-wrap");
      if (!menuPop.classList.contains("hidden") && wrap && !wrap.contains(event.target)) {
        menuPop.classList.add("hidden");
        menuBtn.setAttribute("aria-expanded", "false");
      }
    });

    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    renderToday();
    renderProgress();
    renderTaste();
    renderShop();
  </script>
</body>
</html>
